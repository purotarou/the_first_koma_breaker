uic.addEventListener('touchstart',e=>{e.preventDefault();touchMode=hasTouch=true;for(const t of e.changedTouches){const p=evPos(t);if(G.state!=='play'){tap(p);continue}let hit=null;for(const k in BTN){const b=BTN[k];if(Math.hypot(p.x-b.x,p.y-b.y)<b.r*1.15)hit=k}
if(hit){touch.hold[t.identifier]=hit;if(hit==='fire'){touch.fid=t.identifier;touch.lx=p.x;touch.ly=p.y}else inp[hit]=true}
else if(p.x<W*0.42&&touch.sid<0){touch.sid=t.identifier;touch.ox=clamp(p.x,90,400);touch.oy=clamp(p.y,300,630);touch.dx=touch.dy=0}
else if(touch.lid<0){touch.lid=t.identifier;touch.lx=p.x;touch.ly=p.y}}},{passive:false});
uic.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const p=evPos(t);if(t.identifier===touch.sid){let dx=p.x-touch.ox,dy=p.y-touch.oy;const l=Math.hypot(dx,dy);if(l>70){dx*=70/l;dy*=70/l}touch.dx=dx/70;touch.dy=dy/70}
else if(t.identifier===touch.lid||t.identifier===touch.fid){inp.lx+=(p.x-touch.lx)*0.0052;inp.ly+=(p.y-touch.ly)*0.0042;touch.lx=p.x;touch.ly=p.y}}},{passive:false});
function tEnd(e){e.preventDefault();for(const t of e.changedTouches){if(t.identifier===touch.sid){touch.sid=-1;touch.dx=touch.dy=0}if(t.identifier===touch.lid)touch.lid=-1;if(t.identifier===touch.fid)touch.fid=-1;delete touch.hold[t.identifier]}}
uic.addEventListener('touchend',tEnd,{passive:false});uic.addEventListener('touchcancel',tEnd,{passive:false});

let GDT=0;
function setCamera(dt){if(G.state==='title'&&!G.demoOn){const a=now*0.12;cam.x=Math.sin(a)*19;cam.z=3+Math.cos(a)*17;cam.y=5+Math.sin(now*0.2)*1.5;const dx=-cam.x,dy=4.5-cam.y,dz=-9-cam.z;cam.yaw=Math.atan2(-dx,-dz);cam.pitch=Math.atan2(dy,Math.hypot(dx,dz));cam.roll=0;cam.fov=70*PI/180}
else{const s=trauma*trauma;cam.x=pl.x;cam.z=pl.z;cam.y=1.62+Math.abs(Math.sin(pl.bob))*0.05*pl.moving-(pl.dead?Math.min(1.1,pl.deadT*1.2):0);cam.yaw=pl.yaw+rnd(-1,1)*s*0.04;cam.pitch=pl.pitch+pl.kick+rnd(-1,1)*s*0.04;cam.roll=pl.tilt+rnd(-1,1)*s*0.05+(pl.dead?Math.min(0.5,pl.deadT*0.5):0);

function update(dt){RDT=dt;now+=dt;G.t+=dt;let g=dt;if(hitStop>0){hitStop-=dt;g=0}else if(slowT>0){slowT-=dt;g=dt*slowK}GDT=g;
if(wipe.on){wipe.t+=dt/0.6;if(wipe.t>=0.5&&!wipe.done){wipe.done=true;wipe.cb()}if(wipe.t>=1)wipe.on=false}
const demo=G.state==='title'&&G.demoOn;
if(G.state==='title'&&!G.demoOn){G.idle+=dt;if(G.idle>5)startWipe(demoStart);updateParts(g)}
else{if(demo){aiControl(Math.max(g,0.001));demoUpdate(g)}else if(G.state==='play'){readInput();updateWaves(g)}else{inp.fire=false;inp.mx=inp.mz=0}
if(G.cine>0){G.cine-=dt;const k=Math.min(1,dt*5);pl.yaw+=angDiff(Math.atan2(pl.x,pl.z+21),pl.yaw)*k;pl.pitch+=(Math.atan2(19,Math.hypot(pl.x,pl.z+26))-pl.pitch)*k}
updatePlayer(g);updateEnemies(g);updateShots(g);updateParts(g);G.comboT-=dt;if(G.comboT<=0)G.combo=0}

trauma=Math.max(0,trauma-dt*1.8);flashA=Math.max(0,flashA-dt*5);invA=Math.max(0,invA-dt*9);hurtA=Math.max(pl.hp<30&&G.state==='play'?0.3+0.12*Math.sin(now*7):0,hurtA-dt*2.2);lineA=Math.max(0,lineA-dt*3.5);
ageTexts(dt);hitMark-=dt;cutSp-=dt;cutBoss-=dt;G.bannerT+=dt;G.intro+=dt;G.comboPop-=dt;monoA=lerp(monoA,(G.state==='over'||(G.state==='clear'&&G.resT>0.2))?0.85:0,Math.min(1,dt*3));
if(G.state==='clear'||G.state==='over')G.resT+=dt;music();setCamera(dt)}

gl.bindFramebuffer(gl.FRAMEBUFFER,gFbo);gl.viewport(0,0,W,H);gl.clearBufferfv(gl.COLOR,0,[0,0,0,1]);gl.clearBufferfv(gl.COLOR,1,[0.5,0.5,0,0]);gl.clearBufferfv(gl.DEPTH,0,[1]);
gl.useProgram(pG.p);gl.uniformMatrix4fv(pG.u.uVP,false,VP);gl.uniformMatrix4fv(pG.u.uLVP,false,LVP);gl.uniformMatrix4fv(pG.u.uV,false,VIEW);gl.uniform3f(pG.u.uLD,LD[0],LD[1],LD[2]);gl.uniform3f(pG.u.uCam,cam.x,cam.y,cam.z);
gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,shTex);gl.uniform1i(pG.u.uSh,0);flushLayer(0);flushLayer(1);gl.depthRange(0,0.08);flushLayer(2);gl.depthRange(0,1);
gl.disable(gl.DEPTH_TEST);gl.bindVertexArray(quadVao);gl.bindFramebuffer(gl.FRAMEBUFFER,pFbo);gl.useProgram(pP.p);const u=pP.u;
gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,gCol);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,gNrm);gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,gDep);

gl.uniform1f(u.uNear,NEAR);gl.uniform1f(u.uFar,FAR);gl.uniform1f(u.uTime,now);gl.uniform1f(u.uMood,G.mood);gl.uniform1f(u.uFlash,Math.min(1,flashA));gl.uniform1f(u.uInv,invA>0.3?1:0);gl.uniform1f(u.uMono,monoA);gl.uniform1f(u.uHurt,hurtA);
gl.uniform3f(u.uCR,cR[0],cR[1],cR[2]);gl.uniform3f(u.uCU,cU[0],cU[1],cU[2]);gl.uniform3f(u.uCF,cF[0],cF[1],cF[2]);gl.drawArrays(gl.TRIANGLES,0,3);
